name: Release

# Builds the Windows release (portable zip + Inno Setup installer + SHA256SUMS)
# and publishes it as a GitHub Release when a tag like v0.1.0 is pushed.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Version from tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got $env:TAG)" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Fluxio.Web/package-lock.json

      - name: Phone UI
        working-directory: src/Fluxio.Web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test Fluxio.sln -c Release

      - name: Publish self-contained single-file app
        run: >
          dotnet publish src/Fluxio.Desktop -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o artifacts/publish/win-x64

      - name: Smoke test (the app starts)
        shell: pwsh
        run: |
          $p = Start-Process artifacts/publish/win-x64/Fluxio.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Fluxio.exe exited during startup (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item LICENSE artifacts/publish/win-x64/LICENSE.txt
          Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath "artifacts/release/Fluxio-$env:VERSION-win-x64.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=..\artifacts\publish\win-x64" "/DOutputDir=..\artifacts\release" installer\Fluxio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location artifacts/release
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:VERSION.md"
          if (-not (Test-Path $notes)) { $notes = $null }
          $files = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } elseif ($notes) {
            gh release create $env:TAG @files --title "Fluxio $env:VERSION" --notes-file $notes
          } else {
            gh release create $env:TAG @files --title "Fluxio $env:VERSION" --generate-notes
          }
